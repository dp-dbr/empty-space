services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dpac
      POSTGRES_PASSWORD: dpac
      POSTGRES_DB: dpac
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpac"]
      interval: 5s
  api:
    build: ./backend
    env_file: [.env]
    environment:
      DP_AC_DATABASE_URL: postgresql+psycopg://dpac:dpac@db:5432/dpac
      DP_AC_RUN_WORKER: "false"
    command: sh -c "dpac db upgrade && dpac serve --host 0.0.0.0 --port 8000"
    volumes: [data:/data]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  worker:
    build: ./backend
    env_file: [.env]
    environment:
      DP_AC_DATABASE_URL: postgresql+psycopg://dpac:dpac@db:5432/dpac
    command: dpac worker
    volumes: [data:/data]
    depends_on: [api]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
  # Optional: OpenTelemetry collector; set DP_AC_OTLP_ENDPOINT=http://otel:4318
  otel:
    image: otel/opentelemetry-collector:0.110.0
    profiles: [observability]
volumes:
  pgdata: {}
  data: {}
